        <div class="form-card" id="demo">
          <h3 class="dual dual--on-blue">Ready to Talk With <span class="accent">Renkim</span> Today?</h3>
          <p class="form-card__sub">... fill out the form below to get started</p>
          <!-- TODO(endpoint): this form posts nowhere yet. Wire it to the LeadConnector form
               07LpuJ7IJcHZgH91U4ie (or Renkim's chosen endpoint) in src/form.js -> submitForm(). -->
          <form class="demo-form" id="demo-form" action="" method="post" novalidate>
            <div class="field">
              <label for="f-name">First Name, Last Name <span class="req" aria-hidden="true">*</span></label>
              <input id="f-name" name="full_name" type="text" autocomplete="name" required />
              <p class="field__error" id="f-name-err" hidden>Please enter your name.</p>
            </div>
            <div class="field">
              <label for="f-org">Organization <span class="req" aria-hidden="true">*</span></label>
              <input id="f-org" name="organization" type="text" autocomplete="organization" required />
              <p class="field__error" id="f-org-err" hidden>Please enter your organization.</p>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="f-phone">Phone <span class="req" aria-hidden="true">*</span></label>
                <input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required />
                <p class="field__error" id="f-phone-err" hidden>Please enter a phone number.</p>
              </div>
              <div class="field">
                <label for="f-email">Email <span class="req" aria-hidden="true">*</span></label>
                <input id="f-email" name="email" type="email" autocomplete="email" required />
                <p class="field__error" id="f-email-err" hidden>Please enter a valid email address.</p>
              </div>
            </div>
            <div class="field">
              <label for="f-msg">Your Message...</label>
              <textarea id="f-msg" name="message" rows="4"></textarea>
            </div>
            <button class="btn btn--green btn--block" type="submit">Submit</button>
            <p class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
