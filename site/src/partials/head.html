  <script>
    // Decide motion before first paint so the layout never shifts when the motion layer loads.
    // ?reduced=1 forces the static page (QA), ?motion=1 forces motion.
    (function () {
      var q = location.search, d = document.documentElement;
      var reduce = /[?&]reduced=1/.test(q) || (!/[?&]motion=1/.test(q) && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      d.classList.add(reduce ? 'motion-reduce' : 'motion-ok');
    })();
  </script>
